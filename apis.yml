name: Alcresta Therapeutics
description: 'Alcresta Therapeutics is a specialty pharmaceutical company developing enzyme-based products
  that improve fat absorption and digestive health for people with rare and chronic conditions. Its lead
  product, the RELiZORB (immobilized lipase) cartridge, uses the company''s patented iLipase microbead
  technology to mimic pancreatic lipase and hydrolyze fats in enteral (tube) feeding formulas, helping
  patients with exocrine pancreatic insufficiency, cystic fibrosis, short bowel syndrome, and critical-care
  nutrition needs absorb fatty acids they otherwise could not. Alcresta is backed by Bessemer Venture
  Partners. The company operates a corporate and product marketing website but publishes no public developer
  API, SDKs, or machine-readable API specifications at this time.'
